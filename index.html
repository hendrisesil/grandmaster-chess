<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Grandmaster Chess</h1>
        </header>
        
        <main class="game-area">
            <div class="board-container">
                <div id="board" class="board"></div>
            </div>
            
            <aside class="controls">
                <div class="panel glass-panel">
                    <h2>Game Status</h2>
                    <div id="status" class="status-text">White to move</div>
                    <div id="captured-pieces" class="captured-area">
                        <!-- Captured pieces will go here -->
                    </div>
                </div>

                <div class="panel glass-panel">
                    <h2>Settings</h2>
                    <div class="control-group">
                        <label for="difficulty">AI Difficulty</label>
                        <select id="difficulty">
                            <option value="0">Easy (Random)</option>
                            <option value="1" selected>Medium (Basic)</option>
                            <option value="2">Hard (Advanced)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="orientation">Play As</label>
                        <select id="orientation">
                            <option value="white">White</option>
                            <option value="black">Black</option>
                        </select>
                    </div>
                    <button id="new-game-btn" class="btn primary-btn">New Game</button>
                    <button id="undo-btn" class="btn secondary-btn">Undo Move</button>
                </div>
            </aside>
        </main>
    </div>

    <script src="lib/chess.js"></script>
    <script src="script.js"></script>
</body>
</html>
